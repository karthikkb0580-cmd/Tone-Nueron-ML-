name: Desktop downloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ToneNeuron-windows.exe
          - os: macos-latest
            asset: ToneNeuron-macos.zip
          - os: ubuntu-latest
            asset: ToneNeuron-linux.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries (Linux Qt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3 libgl1 zip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PySide6-Essentials pyinstaller

      - name: Build
        run: pyinstaller packaging/ToneNeuron.spec --noconfirm --clean

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [ -f dist/ToneNeuron.exe ]; then
            cp dist/ToneNeuron.exe "out/${{ matrix.asset }}"
          else
            zip -9 -j "out/${{ matrix.asset }}" dist/ToneNeuron
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset }}
          generate_release_notes: true
