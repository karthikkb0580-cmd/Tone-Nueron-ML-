name: Desktop downloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries (Linux Qt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3 libgl1

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PySide6-Essentials pyinstaller

      - name: Build
        run: pyinstaller packaging/ToneNeuron.spec --noconfirm --clean

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cat > dist/ToneNeuron/README.txt <<'EOF'
          Tone Neuron desktop app

          Windows:  double-click ToneNeuron.exe
          macOS:    chmod +x ToneNeuron && ./ToneNeuron
          Linux:    ./ToneNeuron

          The API starts automatically inside the app - no Python and no server setup needed.
          Data and logs: %USERPROFILE%\.tone-neuron (Windows) or ~/.tone-neuron (macOS/Linux).

          This build is unsigned, so Windows SmartScreen may ask for confirmation:
          choose "More info" -> "Run anyway".
          EOF
          python - <<'PY'
          import os, shutil
          version = os.environ.get("GITHUB_REF_NAME", "").lstrip("v")
          if version in ("", "main", "master"):
              version = "dev"
          name = f"ToneNeuron-{version}-${{ matrix.platform }}"
          shutil.make_archive(f"out/{name}", "zip", "dist", "ToneNeuron")
          print("wrote", name + ".zip")
          PY
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ToneNeuron-${{ matrix.platform }}
          path: out/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
