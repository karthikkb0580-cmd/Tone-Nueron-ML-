[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tone-neuron"
version = "0.1.0"
description = "Tone Neuron — cross-cultural communication assistant with a desktop mascot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
ui = ["PySide6-Essentials>=6.6"]
ml = ["fasttext-wheel>=0.9.2", "sentence-transformers>=2.7"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["tone_neuron*"]

[tool.setuptools.package-data]
tone_neuron = ["data/**/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
